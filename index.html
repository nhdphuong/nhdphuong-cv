<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nguyễn Hà Duy Phương – CV</title>
  <link rel="stylesheet" href="style.css">
  <style>
    @page { size: A4; margin: 14mm 16mm; }
    body.web { max-width: 820px; margin: 0 auto; padding: 40px 60px; }
    @media print { body.web { padding: 0; max-width: none; } }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
</head>
<body class="web">
  <main id="cv"></main>
  <script>
    const el = document.getElementById("cv");
    let last = null;

    async function render() {
      const res = await fetch("CV.md", { cache: "no-store" });
      const text = await res.text();
      if (text === last) return;
      last = text;
      el.innerHTML = marked.parse(text);
    }

    render();
    // live preview: re-fetch CV.md so edits show up without a manual reload
    setInterval(render, 1000);
  </script>
</body>
</html>
