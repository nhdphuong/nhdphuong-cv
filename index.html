<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nguyễn Hà Duy Phương – CV</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    @page { size: A4; margin: 14mm 16mm; }
  </style>
  <script src="assets/libs/marked.min.js"></script>
</head>
<body class="web">
  <main id="cv"></main>
  <script>
    const el = document.getElementById("cv");
    let last = null;

    async function render() {
      const res = await fetch("nhdphuong-cv.md", { cache: "no-store" });
      const text = await res.text();
      if (text === last) return;
      last = text;
      el.innerHTML = marked.parse(text);
    }

    render();
    // live preview: re-fetch nhdphuong-cv.md so edits show up without a manual reload
    setInterval(render, 1000);
  </script>
</body>
</html>
